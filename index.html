<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CYBER_NEWS // AI_AVATAR_DAILY</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
</head>
<body>
  <!-- 掃描線遮罩 -->
  <div class="scanlines"></div>
  <div class="vignette"></div>

  <!-- 頂部 HUD 系統資訊欄 -->
  <header class="hud-bar">
    <div class="hud-left">
      <span class="pulse-indicator"></span>
      <span id="sys-status">SYS_RECV // ONLINE</span>
    </div>
    <div class="hud-right">
      <span>REFRESH IN: <b id="countdown-timer">10s</b></span>
      <span>SYS_TIME: <b id="clock-display">00:00:00</b></span>
    </div>
  </header>

  <!-- 全局新聞走馬燈 -->
  <div class="ticker-wrap">
    <div class="ticker-label">BREAKING</div>
    <div class="ticker-text" id="ticker-content">LOADING AI AVATAR DATABASE...</div>
  </div>

  <main class="app-container">
    <!-- 日報主標題 -->
    <section class="bulletin-header">
      <div class="meta-tag">SYSTEM BULLETIN // VOL.2026</div>
      <h1 class="glitch-title" data-text="AI_AVATAR_DAILY">AI_AVATAR_DAILY</h1>
      <p class="bulletin-sub">[ 虛擬角色與 AI 伴侶情報日報 // 10S AUTO-REFRESH ]</p>
    </section>

    <!-- 3 則隨機新聞卡片展示區 -->
    <section class="news-grid" id="news-container">
      <div class="loading-card">INITIALIZING CYBER LINK TO CSV...</div>
    </section>

    <!-- 系統控制按鈕 -->
    <section class="control-panel">
      <button class="cyber-btn" id="manual-refresh-btn">
        <span class="btn-glitch"></span>
        <span class="btn-text">⚡ OVERRIDE_FETCH_NOW</span>
      </button>
    </section>
  </main>

  <!-- 底部導航區 -->
  <footer class="bottom-nav">
    <span class="nav-brand">CYBER_CORE v3.0</span>
    <span class="nav-status">CSV_SOURCE: ACTIVE</span>
  </footer>

  <script src="main.js"></script>
</body>
</html>
